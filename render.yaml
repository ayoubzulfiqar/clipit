services:
  - type: web
    name: clipit-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: standard
    envVars:
      - key: PORT
        value: 8000
      - key: GOOGLE_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: MAX_CONCURRENT_JOBS
        value: "2"
    disk:
      name: clipit-storage
      mountPath: /app/outputs
      sizeGB: 20
