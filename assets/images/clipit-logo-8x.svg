<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>

    <!-- Core Brand Gradient (Electric Violet to Neon Cyan) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Inner Ambient Radial Glow -->
  <circle cx="256" cy="220" r="140" fill="#6366F1" opacity="0.12" filter="url(#softGlow)" />

  <!-- Vertical 9:16 Video Frame -->
  <rect x="176" y="96" width="160" height="248" rx="26" fill="rgba(255, 255, 255, 0.03)" stroke="url(#brandGrad)" stroke-width="12" />

  <!-- Center Play / Slice Icon -->
  <path d="M 234 184 L 298 220 L 234 256 Z" fill="url(#brandGrad)" filter="url(#softGlow)" />

  <!-- Precision Cutting Notches (Left & Right) -->
  <path d="M 164 220 L 188 220" stroke="#EC4899" stroke-width="8" stroke-linecap="round" />
  <path d="M 324 220 L 348 220" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" />

  <!-- Top AI Sparkle -->
  <path d="M 334 114 Q 334 132 348 132 Q 334 132 334 150 Q 334 132 320 132 Q 334 132 334 114 Z" fill="url(#accentGrad)" />

  <!-- Audio Wave Tick Marks (Bottom of frame) -->
  <line x1="216" y1="316" x2="216" y2="324" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="236" y1="312" x2="236" y2="328" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="308" x2="256" y2="332" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="276" y1="312" x2="276" y2="328" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round" />
  <line x1="296" y1="316" x2="296" y2="324" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />

  <!-- Logo Typography -->
  <g transform="translate(256, 424)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Inter&#39;, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Clip</tspan><tspan fill="url(#brandGrad)">IT</tspan>
    </text>
  </g>
</svg>