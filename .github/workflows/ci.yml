name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi pydantic python-multipart python-dotenv requests pillow numpy yt-dlp
          pip install -e . --no-deps

      - name: Run automated test suite
        run: |
          pytest tests/ -v

  build-frontend:
    name: Frontend Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies and build dashboard SPA
        working-directory: web/dashboard
        run: |
          npm ci
          npm run build
