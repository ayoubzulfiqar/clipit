[project]
name = "clipit"
version = "1.15.0"
description = "AI Auto-Clipper & Teaser Generator — converts long videos into viral short-form clips"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Ayoub Zulfiqar", email = "contact@ayoubzulfiqar.com" }]
dependencies = [
    "yt-dlp[default]",
    "requests",
    "python-dotenv",
    "Pillow",
    "numpy<2.0.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic>=2.0.0",
    "gdown",
]

[project.optional-dependencies]
ai = [
    "google-genai",
    "faster-whisper",
    "edge-tts",
]
cv = [
    "opencv-python",
    "mediapipe",
    "ultralytics",
]
gpu = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
podcast = [
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
uploader = [
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
all = [
    "google-genai",
    "faster-whisper",
    "edge-tts",
    "opencv-python",
    "mediapipe",
    "ultralytics",
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "pytest>=7.0.0",
    "pytest-asyncio",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
clipit = "main:main"
clipping = "main:main"
clipit-api = "web.api.app:main"
clipit-web = "web.api.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
